<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hornero: the oven-bird's mud nest — a dome of stacked mud with an
       arched entrance cut into one side. -->
  <defs>
    <linearGradient id="clay" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#D4774E"/>
      <stop offset="55%" stop-color="#B65C38"/>
      <stop offset="100%" stop-color="#8E4227"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F0E7"/>
      <stop offset="100%" stop-color="#E7D2BD"/>
    </linearGradient>
    <!-- The entrance is punched out of the dome, not drawn on top of it. -->
    <mask id="doorway">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M274 430 v-116 a48 48 0 0 1 96 0 v116 Z" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <g mask="url(#doorway)">
    <!-- dome: a slightly flattened half-ellipse resting on the ground -->
    <path d="M76 430 a180 244 0 0 1 360 0 Z" fill="url(#clay)"/>
    <!-- the spiral seams left by stacked mud pellets -->
    <path d="M118 430 a138 190 0 0 1 276 0" fill="none" stroke="#7C3F26"
          stroke-width="8" opacity="0.24" stroke-linecap="round"/>
    <path d="M160 430 a96 134 0 0 1 192 0" fill="none" stroke="#7C3F26"
          stroke-width="7" opacity="0.19" stroke-linecap="round"/>
    <path d="M202 430 a54 76 0 0 1 108 0" fill="none" stroke="#7C3F26"
          stroke-width="6" opacity="0.14" stroke-linecap="round"/>
  </g>

  <!-- the dark interior seen through the doorway -->
  <path d="M274 430 v-116 a48 48 0 0 1 96 0 v116 Z" fill="#48230F"/>
  <path d="M274 430 v-116 a48 48 0 0 1 96 0" fill="none" stroke="#7C3F26"
        stroke-width="10" stroke-linecap="round"/>

  <!-- ground -->
  <rect x="56" y="422" width="400" height="22" rx="11" fill="#7C3F26"/>
</svg>
