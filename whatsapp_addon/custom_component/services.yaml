---
send_message:
  name: Send message
  description: Send a Whatsapp message
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should the message come from
      required: true
      example: default
    to:
      name: Target User ID
      description: Target User ID
      required: true
      example: 391234567890@s.whatsapp.net
    body:
      name: Message's body
      description: Message's body
      required: true
      advanced: true
    typing:
      name: Typing indicator
      description: >-
        Set to false to send immediately, without the typing indicator or its
        pause. Use it for urgent alerts.
      required: false
      example: false
      selector:
        boolean:

send_media:
  name: Send media
  description: >-
    Send a snapshot or a recorded clip from a camera or image entity.
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should the media come from
      required: true
      example: default
      selector:
        text:
    to:
      name: Target User ID
      description: >-
        Phone number, or the JID of a group. Use the WhatsApp panel in the
        sidebar to look up the ID of a group.
      required: true
      example: 391234567890@s.whatsapp.net
      selector:
        text:
    entity_id:
      name: Camera or image entity
      description: The entity to capture from
      required: true
      example: camera.front_door
      selector:
        entity:
          domain:
            - camera
            - image
    caption:
      name: Caption
      description: Text sent along with the media
      required: false
      example: Someone is at the door
      selector:
        text:
    duration:
      name: Video duration (seconds)
      description: >-
        Record a clip of this many seconds instead of sending a still image.
        Requires a camera that supports streaming.
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: seconds
    lookback:
      name: Lookback (seconds)
      description: >-
        Include this many seconds recorded before the call, taken from the
        stream buffer. Useful when the interesting part already happened.
      required: false
      example: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds
    typing:
      name: Typing indicator
      description: >-
        Set to false to send immediately, without the typing indicator or its
        pause. Use it for urgent alerts.
      required: false
      example: false
      selector:
        boolean:

set_status:
  name: Set status
  description: Sets the current user's status message
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
    status:
      name: New status message
      description: New status message
      required: true
      example: Available

presence_subscribe:
  name: Presence subscribe
  description: >-
    Subscribe to user presence update like online, offline, typing, etc...
    Please first use send infinity presence update service to always appear
    online.
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
    userId:
      name: Target User ID
      description: Target User ID
      required: true
      example: 391234567890@s.whatsapp.net

send_presence_update:
  name: Send presence update
  description: Send presence update like online, offline, typing, etc...
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
    type:
      name: Presence type
      description: Presence type
      required: true
      example: composing
      selector:
        select:
          options:
            - "unavailable"
            - "available"
            - "composing"
            - "recording"
            - "paused"
    to:
      name: Target User ID
      description: Target User ID
      required: false
      example: 391234567890@s.whatsapp.net

send_infinity_presence_update:
  name: Send infinity presence update
  description: Send presence update like online, offline, typing, etc... for a long time
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
    type:
      name: Presence type
      description: Presence type
      required: true
      example: composing
      selector:
        select:
          options:
            - "unavailable"
            - "available"
            - "composing"
            - "recording"
            - "paused"
    to:
      name: Target User ID
      description: Target User ID
      required: false
      example: 391234567890@s.whatsapp.net
