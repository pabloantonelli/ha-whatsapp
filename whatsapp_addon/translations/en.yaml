---
configuration:
  clients:
    name: Clients
    description: >-
      One entry per WhatsApp account. Each client is paired separately and is
      addressed by this name in the clientId field of every service call.
  api_token:
    name: API token
    description: >-
      Bearer token protecting the add-on HTTP API. Leave empty to have one
      generated automatically on first start.
  log_level:
    name: Log level
    description: >-
      How much detail to write to the add-on log. Raise it to debug or trace
      when diagnosing connection problems.
  mark_online:
    name: Appear online
    description: >-
      Mark the account as online while the add-on is connected. Leaving this off
      keeps notifications flowing to your phone.
  refresh_hours:
    name: Periodic reconnect (hours)
    description: >-
      Force a reconnection every N hours. Leave at 0 unless you are working
      around a stability problem; it is not needed on Baileys 7.
  typing_indicator:
    name: Typing indicator
    description: >-
      Show "typing…" (or "recording…" for voice notes) before sending, and pause
      briefly first. The pause also stops consecutive messages from going out as
      an instant, evenly spaced burst.
  typing_max_seconds:
    name: Maximum typing pause (seconds)
    description: >-
      Upper bound for that pause. The actual wait varies with the length of the
      message. Set to 0 to send immediately.
  allowed_senders:
    name: Allowed senders
    description: >-
      Only these senders may trigger Home Assistant events. Leave empty to
      accept everyone. This seeds the list on first start; afterwards edit it
      from the Incoming tab of the WhatsApp panel.
